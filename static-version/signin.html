<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="meta.signin">Sign In — Faatix</title>
  <meta name="description" content="Sign in to your Faatix account.">
  <link rel="icon" href="assets/img/faatix-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="signin">
  <div data-component="header"></div>

  <main id="main" class="auth">
    <div class="container">
      <div class="auth__shell">
        <aside class="auth__aside">
          <div data-component="landscape"></div>
          <h2 data-i18n="signin.panelTitle"></h2>
          <ul>
            <li><span class="icon-tile icon-tile--sm icon-tile--dark"><span data-icon="shield"></span></span><span data-i18n="signin.panel1"></span></li>
            <li><span class="icon-tile icon-tile--sm"><span data-icon="languages"></span></span><span data-i18n="signin.panel2"></span></li>
            <li><span class="icon-tile icon-tile--sm icon-tile--dark"><span data-icon="smartphone"></span></span><span data-i18n="signin.panel3"></span></li>
          </ul>
        </aside>

        <div class="auth__form">
          <a class="auth__back" href="index.html"><span data-icon="arrow-left"></span><span data-i18n="signin.back"></span></a>
          <h1 data-i18n="signin.title"></h1>
          <p data-i18n="signin.subtitle"></p>

          <form id="signin-form" class="form" novalidate>
            <div class="field">
              <label for="email" data-i18n="signin.email"></label>
              <div class="input-wrap">
                <span data-icon="mail"></span>
                <input id="email" name="email" type="email" autocomplete="email" required data-i18n-attr="placeholder:signin.emailPh">
              </div>
            </div>

            <div class="field">
              <label for="password" data-i18n="signin.password"></label>
              <div class="input-wrap">
                <span data-icon="lock"></span>
                <input id="password" name="password" type="password" autocomplete="current-password" required data-i18n-attr="placeholder:signin.passwordPh">
                <button class="password-toggle" type="button" aria-pressed="false" aria-controls="password" data-i18n-attr="aria-label:signin.show"><span data-icon="eye"></span></button>
              </div>
            </div>

            <div class="form__row">
              <label class="checkbox"><input type="checkbox" name="remember"><span data-i18n="signin.remember"></span></label>
              <a class="text-link" href="#" data-i18n="signin.forgot"></a>
            </div>

            <p class="form-status" role="status" aria-live="polite" hidden></p>

            <button class="btn btn--primary btn--lg btn--block" type="submit"><span data-i18n="signin.submit"></span><span data-icon="arrow-right"></span></button>
          </form>

          <p class="auth__alt"><span data-i18n="signin.noAccount"></span> <a class="text-link" href="#" data-i18n="signin.contact"></a></p>
        </div>
      </div>
    </div>
  </main>

  <div data-component="footer"></div>

  <script src="assets/js/translations.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/icons.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
