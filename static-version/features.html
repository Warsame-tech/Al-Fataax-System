<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="meta.features">Features — Faatix</title>
  <meta name="description" content="Explore the core features of the Faatix business system.">
  <link rel="icon" href="assets/img/faatix-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="features">
  <div data-component="header"></div>

  <main id="main">
    <!-- Page hero -->
    <section class="page-hero">
      <div class="hero__bg" aria-hidden="true"></div>
      <div class="container page-hero__grid">
        <div class="page-hero__text">
          <span class="badge"><span data-icon="layers"></span><span data-i18n="features.badge"></span></span>
          <h1 data-i18n-html="features.title"></h1>
          <p data-i18n="features.subtitle"></p>
          <div class="hero__actions">
            <a class="btn btn--primary btn--lg" href="signin.html"><span data-i18n="common.getStarted"></span><span data-icon="arrow-right"></span></a>
            <a class="btn btn--ghost btn--lg" href="who.html" data-i18n="nav.who"></a>
          </div>
        </div>
        <div class="art-card" data-reveal aria-hidden="true">
          <div data-component="landscape"></div>
          <div class="art-panel">
            <span class="icon-tile icon-tile--brand"><span data-icon="dashboard"></span></span>
            <span class="icon-tile"><span data-icon="file-text"></span></span>
            <span class="icon-tile icon-tile--dark"><span data-icon="bar-chart"></span></span>
            <span class="icon-tile"><span data-icon="users"></span></span>
            <span class="icon-tile icon-tile--dark"><span data-icon="lock"></span></span>
            <span class="icon-tile icon-tile--brand"><span data-icon="smartphone"></span></span>
          </div>
          <div class="float-card float-card--tl">
            <span class="icon-tile"><span data-icon="trending-up"></span></span>
            <div><strong data-i18n="mock.performance"></strong><small>+18% · <span data-i18n="mock.thisMonth"></span></small></div>
          </div>
          <div class="float-card float-card--r">
            <span class="icon-tile"><span data-icon="shield"></span></span>
            <div><strong data-i18n="mock.secure"></strong><small data-i18n="mock.secureSub"></small></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Showcase (reference layout) -->
    <section class="section section--tight">
      <div class="container">
        <div data-component="showcase"></div>
      </div>
    </section>

    <!-- Core features -->
    <section class="section section--surface">
      <div class="container">
        <div class="section-head" data-reveal>
          <h2 data-i18n-html="features.coreTitle"></h2>
          <p data-i18n="features.coreSub"></p>
        </div>
        <div class="card-grid card-grid--4">
          <article class="icon-card" data-reveal>
            <span class="icon-tile"><span data-icon="dashboard"></span></span>
            <h3 data-i18n="features.f1"></h3><p data-i18n="features.f1Text"></p>
          </article>
          <article class="icon-card" data-reveal data-reveal-delay="1">
            <span class="icon-tile"><span data-icon="folder"></span></span>
            <h3 data-i18n="features.f2"></h3><p data-i18n="features.f2Text"></p>
          </article>
          <article class="icon-card" data-reveal data-reveal-delay="2">
            <span class="icon-tile"><span data-icon="bar-chart"></span></span>
            <h3 data-i18n="features.f3"></h3><p data-i18n="features.f3Text"></p>
          </article>
          <article class="icon-card" data-reveal data-reveal-delay="3">
            <span class="icon-tile"><span data-icon="users"></span></span>
            <h3 data-i18n="features.f4"></h3><p data-i18n="features.f4Text"></p>
          </article>
          <article class="icon-card" data-reveal>
            <span class="icon-tile"><span data-icon="shield"></span></span>
            <h3 data-i18n="features.f5"></h3><p data-i18n="features.f5Text"></p>
          </article>
          <article class="icon-card" data-reveal data-reveal-delay="1">
            <span class="icon-tile"><span data-icon="languages"></span></span>
            <h3 data-i18n="features.f6"></h3><p data-i18n="features.f6Text"></p>
          </article>
          <article class="icon-card" data-reveal data-reveal-delay="2">
            <span class="icon-tile"><span data-icon="smartphone"></span></span>
            <h3 data-i18n="features.f7"></h3><p data-i18n="features.f7Text"></p>
          </article>
          <article class="icon-card placeholder-card" data-reveal data-reveal-delay="3">
            <span class="icon-tile"><span data-icon="plus"></span></span>
            <h3 data-i18n="features.f8"></h3><p data-i18n="features.f8Text"></p>
          </article>
        </div>
      </div>
    </section>

    <!-- How it works -->
    <section class="section">
      <div class="container">
        <div class="section-head" data-reveal>
          <h2 data-i18n-html="features.howTitle"></h2>
          <p data-i18n="features.howSub"></p>
        </div>
        <div class="steps">
          <article class="step" data-reveal>
            <span class="icon-tile icon-tile--dark"><span data-icon="login"></span></span>
            <h3 data-i18n="features.s1"></h3><p data-i18n="features.s1Text"></p>
          </article>
          <article class="step" data-reveal data-reveal-delay="1">
            <span class="icon-tile icon-tile--dark"><span data-icon="folder"></span></span>
            <h3 data-i18n="features.s2"></h3><p data-i18n="features.s2Text"></p>
          </article>
          <article class="step" data-reveal data-reveal-delay="2">
            <span class="icon-tile icon-tile--dark"><span data-icon="trending-up"></span></span>
            <h3 data-i18n="features.s3"></h3><p data-i18n="features.s3Text"></p>
          </article>
        </div>
      </div>
    </section>

    <div data-component="cta"></div>
  </main>

  <div data-component="footer"></div>

  <script src="assets/js/translations.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/icons.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
